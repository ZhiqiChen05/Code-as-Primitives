<text x="73" y="394" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#242620" text-anchor="start" >Optional tools</text>
<line x1="230" y1="370" x2="230" y2="403" stroke="#d7d6ca" stroke-width="1.4" />
<text x="252" y="394" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#242620" text-anchor="start" >Batched parameter search</text>
<text x="535" y="394" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#63675d" text-anchor="start" >+</text>
