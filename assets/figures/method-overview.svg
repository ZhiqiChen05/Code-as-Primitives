<rect x="425" y="539" width="250" height="105" rx="8" fill="#e8eee5" stroke="#276451" stroke-width="1.4"/>
<rect x="800" y="539" width="250" height="105" rx="8" fill="#f6f3eb" stroke="#d7d6ca" stroke-width="1.4"/>
<text x="175" y="581" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#242620" text-anchor="middle" >State observation</text>
<text x="175" y="614" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#63675d" text-anchor="middle" >Read the current state</text>
<text x="550" y="581" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#276451" text-anchor="middle" >Frozen Python policy</text>
<text x="550" y="614" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#63675d" text-anchor="middle" >Execute feedback rules</text>
<text x="925" y="581" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#242620" text-anchor="middle" >Actuator targets</text>
<text x="925" y="614" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#63675d" text-anchor="middle" >Native low-level control</text>
<line x1="312" y1="592" x2="413" y2="592" stroke="#276451" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="687" y1="592" x2="788" y2="592" stroke="#276451" stroke-width="2" marker-end="url(#arrow)"/>
<text x="550" y="687" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#63675d" text-anchor="middle" >The program runs at every control step; the foundation model does not.</text>
