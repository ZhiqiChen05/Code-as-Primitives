<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="874" viewBox="0 0 1100 874" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Three search treatments, one task set</title>
<desc id="figure-desc">Mean held-out success · 69 shared E2 tasks · unaccepted tasks count as zero. Primitive (7 tasks): CEM 95.6%, Agentic search 94.3%, Agentic + grasp 94.0%; Functional (9 tasks): CEM 98.6%, Agentic search 99.2%, Agentic + grasp 96.3%; Articulation (13 tasks): CEM 86.7%, Agentic search 86.6%, Agentic + grasp 81.0%; Bimanual (3 tasks): CEM 97.7%, Agentic search 97.7%, Agentic + grasp 95.3%; Multi-goal (34 tasks): CEM 98.9%, Agentic search 98.8%, Agentic + grasp 99.0%; Long-horizon (3 tasks): CEM 58.0%, Agentic search 54.3%, Agentic + grasp 29.3%. Mean held-out success per task (50 unseen starts, two repeats averaged); unaccepted tasks count as zero.</desc>
