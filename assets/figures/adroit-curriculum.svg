<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="735" viewBox="0 0 1100 735" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Adroit outcomes under fixed-start and random-reset training</title>
<desc id="figure-desc">Final frozen policies after fixed-start versus random-reset sequential learning. Door: fixed 14 of 30, random 29 of 30; Hammer: fixed 25 of 30, random 30 of 30; Pen: fixed 7 of 30, random 30 of 30; Relocate: fixed 12 of 30, random 30 of 30. Nominal per-stage limits match, but actual interaction cost, prompts, and test seed sets differ. One training chain per condition; this is a descriptive comparison, not a controlled causal ablation. Both protocols increase the evaluation batch size across stages.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#276451"/></marker></defs>
