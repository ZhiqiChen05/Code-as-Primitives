<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1002" viewBox="0 0 1100 1002" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Parameter search vs. code-as-policy</title>
<desc id="figure-desc">Held-out success · frozen policies on unseen starts · Pen and Long-horizon shown separately. Adroit Door: parameter search 100.0%, code-as-policy TBD; Adroit Hammer: parameter search 93.3%, code-as-policy TBD; Adroit Relocate: parameter search 66.7%, code-as-policy TBD; DexVerse Primitive (7 tasks): parameter search 94.0%, code-as-policy TBD; DexVerse Functional (9 tasks): parameter search 96.3%, code-as-policy TBD; DexVerse Articulation (13 tasks): parameter search 81.0%, code-as-policy TBD; DexVerse Bimanual (3 tasks): parameter search 95.3%, code-as-policy TBD; DexVerse Multi-goal (34 tasks): parameter search 99.0%, code-as-policy TBD. Mean held-out success per task in the category: 50 unseen starts, two repeats averaged; unaccepted tasks count as zero. Long-horizon is reported with the challenging tasks.</desc>
