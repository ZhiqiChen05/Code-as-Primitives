<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Adroit frozen policies succeeded in 119 of 120 held-out episodes.</title>
<desc id="figure-desc">Door: 29 of 30 episodes, 96.7 percent success, 95 percent Wilson interval 83.3 to 99.4 percent. Hammer, Pen, and Relocate: 30 of 30 episodes each, 100 percent success, interval 88.6 to 100.0 percent. The horizontal success-rate axis spans 0 to 100 percent. There was one training chain per task. Intervals quantify variation across held-out seeds for each frozen policy, not independent training runs. Source: the adroit_seq10_l3pr campaign report.</desc>
